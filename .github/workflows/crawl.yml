name: Daily Crawl

on:
  schedule:
    # 每天 UTC 00:00（台灣時間早上 08:00）；短期報名活動可能不到一週
    - cron: '0 0 * * *'
  workflow_dispatch: # 手動觸發

permissions:
  contents: write

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run crawler
        id: crawler
        run: |
          echo "started_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          npm run crawl
        timeout-minutes: 15

      - name: Validate updated course data
        env:
          CRAWL_STARTED_AT: ${{ steps.crawler.outputs.started_at }}
        run: node scripts/validate-crawl-output.js "$CRAWL_STARTED_AT"

      - name: Upload crawler screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet -- data/courses.json && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/courses.json data/external-courses.json data/taipei-courses.json data/unindexed-activities.json
          git commit -m "🔄 自動更新課程資料 $(date -u '+%Y-%m-%d')"
          git push
