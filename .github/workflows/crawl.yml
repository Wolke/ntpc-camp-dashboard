name: Daily Crawl

on:
  schedule:
    # 每天 UTC 00:00（台灣時間早上 08:00）；短期報名活動可能不到一週
    - cron: '0 0 * * *'
  workflow_dispatch: # 手動觸發

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run crawler
        run: npm run crawl
        timeout-minutes: 15

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet data/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "🔄 自動更新課程資料 $(date -u '+%Y-%m-%d')"
          git push

      - name: Send GitHub Notification
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/commits/$COMMIT_SHA/comments \
            -f body="@${{ github.actor }} 🎉 爬蟲每日排程已成功執行，並更新了最新的課程資料！"
